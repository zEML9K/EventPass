version: '3.8'

services:
  eventpass-db:
    image: mysql:8.0
    container_name: eventpass-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: eventpass
      MYSQL_DATABASE: eventpass_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: